<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="ph-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#181825"/>
      <stop offset="100%" style="stop-color:#1e1e2e"/>
    </linearGradient>
    <linearGradient id="ph-spotlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9e2af;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#f9e2af;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="ph-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fab387"/>
      <stop offset="100%" style="stop-color:#f38ba8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#ph-bg)" rx="12"/>

  <!-- Title Header -->
  <rect x="20" y="16" width="360" height="38" fill="#313244" rx="8"/>
  <text x="200" y="41" fill="#cdd6f4" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">PropHunt (Where is Brian)</text>

  <!-- Game Canvas Area -->
  <rect x="20" y="64" width="360" height="216" fill="#11111b" rx="8"/>

  <!-- 3D Room Grid Floor -->
  <path d="M 20 230 L 380 230 M 50 230 L 20 280 M 110 230 L 80 280 M 170 230 L 150 280 M 230 230 L 230 280 M 290 230 L 310 280 M 350 230 L 380 280" stroke="#45475a" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Seeker Flashlight Cone -->
  <polygon points="50,140 330,100 350,240" fill="url(#ph-spotlight)"/>

  <!-- Seeker Character Silhouette (Left side) -->
  <g transform="translate(40, 120)">
    <circle cx="15" cy="15" r="9" fill="#89b4fa"/>
    <rect x="7" y="24" width="16" height="24" fill="#585b70" rx="3"/>
    <!-- Gun / Flashlight -->
    <rect x="23" y="28" width="18" height="6" fill="#a6adc8" rx="1"/>
    <!-- Light beam source dot -->
    <circle cx="41" cy="31" r="3" fill="#f9e2af"/>
  </g>

  <!-- Crosshair (Center right target) -->
  <circle cx="280" cy="170" r="16" stroke="#f38ba8" stroke-width="1.5" fill="none" opacity="0.8"/>
  <line x1="280" y1="148" x2="280" y2="158" stroke="#f38ba8" stroke-width="1.5"/>
  <line x1="280" y1="182" x2="280" y2="192" stroke="#f38ba8" stroke-width="1.5"/>
  <line x1="258" y1="170" x2="268" y2="170" stroke="#f38ba8" stroke-width="1.5"/>
  <line x1="292" y1="170" x2="302" y2="170" stroke="#f38ba8" stroke-width="1.5"/>

  <!-- Hiding Wooden Crate Prop (Middle Right) -->
  <g transform="translate(255, 145)">
    <rect width="50" height="50" fill="#a67c52" rx="4" stroke="#6e5033" stroke-width="2"/>
    <line x1="0" y1="0" x2="50" y2="50" stroke="#6e5033" stroke-width="1.5"/>
    <line x1="50" y1="0" x2="0" y2="50" stroke="#6e5033" stroke-width="1.5"/>
    <!-- Suspicious Eyes Peek-a-boo inside crate slit -->
    <rect x="12" y="20" width="26" height="10" fill="#181825" rx="2"/>
    <circle cx="19" cy="25" r="3" fill="#a6e3a1"/>
    <circle cx="20" cy="25" r="1.5" fill="#11111b"/>
    <circle cx="31" cy="25" r="3" fill="#a6e3a1"/>
    <circle cx="32" cy="25" r="1.5" fill="#11111b"/>
  </g>

  <!-- Barrel Prop (Environment) -->
  <g transform="translate(170, 160)">
    <ellipse cx="18" cy="8" rx="18" ry="6" fill="#94e2d5"/>
    <rect x="0" y="8" width="36" height="36" fill="#74c7ec"/>
    <ellipse cx="18" cy="44" rx="18" ry="6" fill="#89dceb"/>
    <line x1="0" y1="20" x2="36" y2="20" stroke="#45475a" stroke-width="2"/>
    <line x1="0" y1="32" x2="36" y2="32" stroke="#45475a" stroke-width="2"/>
  </g>

  <!-- Play / Video Overlay Icon (Top Right) -->
  <circle cx="345" cy="90" r="16" fill="#ff0000" opacity="0.9"/>
  <polygon points="341,82 353,90 341,98" fill="#ffffff"/>

  <!-- Multiplayer Status UI -->
  <rect x="30" y="74" width="85" height="18" fill="#313244" rx="4" opacity="0.85"/>
  <text x="72" y="87" fill="#a6e3a1" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">PLAYERS: 8/8</text>
</svg>
