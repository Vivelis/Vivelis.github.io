<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="homelab-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#11111b"/>
    </linearGradient>
    <linearGradient id="server-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#313244"/>
      <stop offset="100%" style="stop-color:#181825"/>
    </linearGradient>
    <linearGradient id="accent-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#94e2d5"/>
      <stop offset="100%" style="stop-color:#89b4fa"/>
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a6e3a1"/>
      <stop offset="100%" style="stop-color:#94e2d5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#homelab-bg)" rx="12"/>

  <!-- Top Header Bar -->
  <rect width="400" height="48" fill="#181825" rx="12"/>
  <rect x="0" y="36" width="400" height="12" fill="#181825"/>

  <!-- Title & Status -->
  <circle cx="24" cy="24" r="5" fill="#a6e3a1"/>
  <text x="36" y="29" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Homelab &amp; K3s Cluster</text>
  <rect x="285" y="14" width="95" height="20" rx="10" fill="#313244"/>
  <text x="332" y="28" fill="#a6e3a1" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ONLINE 24/7</text>

  <!-- Server Rack Illustration -->
  <!-- Main Server Tower Frame -->
  <rect x="40" y="68" width="150" height="190" fill="url(#server-grad)" stroke="#45475a" stroke-width="2" rx="8"/>

  <!-- Server Blade 1 -->
  <rect x="50" y="80" width="130" height="36" fill="#1e1e2e" rx="4" stroke="#585b70" stroke-width="1"/>
  <circle cx="65" cy="98" r="4" fill="#a6e3a1"/>
  <circle cx="77" cy="98" r="4" fill="#89b4fa"/>
  <circle cx="89" cy="98" r="4" fill="#89b4fa"/>
  <line x1="105" y1="94" x2="165" y2="94" stroke="#45475a" stroke-width="3" stroke-dasharray="4 2"/>
  <line x1="105" y1="102" x2="165" y2="102" stroke="#45475a" stroke-width="3" stroke-dasharray="6 2"/>

  <!-- Server Blade 2 -->
  <rect x="50" y="124" width="130" height="36" fill="#1e1e2e" rx="4" stroke="#585b70" stroke-width="1"/>
  <circle cx="65" cy="142" r="4" fill="#a6e3a1"/>
  <circle cx="77" cy="142" r="4" fill="#a6e3a1"/>
  <circle cx="89" cy="142" r="4" fill="#f9e2af"/>
  <line x1="105" y1="138" x2="165" y2="138" stroke="#45475a" stroke-width="3" stroke-dasharray="5 2"/>
  <line x1="105" y1="146" x2="165" y2="146" stroke="#45475a" stroke-width="3" stroke-dasharray="3 2"/>

  <!-- Server Blade 3 -->
  <rect x="50" y="168" width="130" height="36" fill="#1e1e2e" rx="4" stroke="#585b70" stroke-width="1"/>
  <circle cx="65" cy="186" r="4" fill="#a6e3a1"/>
  <circle cx="77" cy="186" r="4" fill="#89b4fa"/>
  <circle cx="89" cy="186" r="4" fill="#a6e3a1"/>
  <line x1="105" y1="182" x2="165" y2="182" stroke="#45475a" stroke-width="3" stroke-dasharray="4 2"/>
  <line x1="105" y1="190" x2="165" y2="190" stroke="#45475a" stroke-width="3" stroke-dasharray="6 2"/>

  <!-- Server Blade 4 (Storage/Switch) -->
  <rect x="50" y="212" width="130" height="36" fill="#1e1e2e" rx="4" stroke="#585b70" stroke-width="1"/>
  <circle cx="65" cy="230" r="4" fill="#a6e3a1"/>
  <circle cx="77" cy="230" r="4" fill="#cba6f7"/>
  <line x1="95" y1="230" x2="165" y2="230" stroke="#94e2d5" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Right Side Panel: Services & Uptime Graph -->
  <!-- K3s Kubernetes Box -->
  <rect x="210" y="68" width="150" height="85" fill="#181825" stroke="#45475a" stroke-width="1.5" rx="8"/>
  <text x="222" y="90" fill="#89b4fa" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Kubernetes (K3s)</text>
  
  <!-- Kubernetes Pod Nodes -->
  <rect x="222" y="100" width="38" height="24" rx="4" fill="#313244"/>
  <text x="241" y="116" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">node-1</text>

  <rect x="266" y="100" width="38" height="24" rx="4" fill="#313244"/>
  <text x="285" y="116" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">node-2</text>

  <rect x="310" y="100" width="38" height="24" rx="4" fill="#313244"/>
  <text x="329" y="116" fill="#cdd6f4" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">node-3</text>

  <circle cx="241" cy="133" r="3" fill="#a6e3a1"/>
  <circle cx="285" cy="133" r="3" fill="#a6e3a1"/>
  <circle cx="329" cy="133" r="3" fill="#a6e3a1"/>

  <!-- Uptime Kuma Monitoring Box -->
  <rect x="210" y="165" width="150" height="93" fill="#181825" stroke="#45475a" stroke-width="1.5" rx="8"/>
  <text x="222" y="186" fill="#a6e3a1" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Uptime Kuma</text>
  
  <!-- Uptime Graph Line -->
  <polyline points="222,235 240,225 255,230 270,210 290,220 310,200 330,205 348,195" fill="none" stroke="url(#accent-green)" stroke-width="2.5"/>
  <circle cx="348" cy="195" r="3.5" fill="#a6e3a1"/>

  <!-- Footer line -->
  <text x="200" y="282" fill="#6c7086" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Bare-metal Home Infrastructure</text>
</svg>
